name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Указываем, что все шаги по умолчанию должны выполняться в папке botmaker
    defaults:
      run:
        working-directory: ./botmaker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
          # Говорим Gradle, где искать корень проекта
          build-root-directory: ./botmaker 

      - name: Build debug APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: BotMaker-APK
          # Обязательно обновляем путь к артефакту, так как APK теперь внутри папки botmaker
          path: botmaker/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error # Билд упадет, если APK не создался
